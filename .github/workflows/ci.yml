# LovelyFrida CI（docs/10 附二 C3 + 批次⑬）：
# - test：每次 push/PR 跑 lint（eslint + cargo fmt/clippy）+ 前端测试/类型检查 + agent 构建 + cargo check/test（windows：后端是 Win 专属路径）
# - build：打 v* tag 时跑两步构建（sidecar exe + NSIS 安装包），按 manifest 供给随包二进制并对账 sha256，
#   并创建 GitHub Release（安装包 + sha256 清单）——C3 的「tag 触发 release」自此完整兑现
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: agent 构建（先于 cargo：frida.rs include_str! 内嵌 dist/core.js）
        working-directory: agent
        shell: bash
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      # shell: bash：pwsh 对多行 run 的中间命令失败不中断（eslint 红了步骤却标绿的坑）
      - name: 前端 lint + 测试 + 类型检查 + 构建
        shell: bash
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Rust lint + 检查 + 测试
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --lib -- -D warnings
          cargo check
          cargo test

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 按 manifest 供给随包二进制（sha256 对账，S-01 供应链）
        run: python scripts/ci_provision_binaries.py

      - name: 安装 sidecar 构建依赖（sidecar/requirements.txt 锁定，S-01 矩阵一致性由 build_sidecar 自检兜底）
        run: pip install -r sidecar/requirements.txt

      - name: agent 构建
        working-directory: agent
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: 前端构建
        run: |
          npm ci
          npm run build

      - name: ① sidecar exe（PyInstaller onefile）
        run: python scripts/build_sidecar.py

      - name: ② NSIS 安装包（资源清单在 bundle overlay：随包二进制已由上一步供给）
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json

      - name: 生成 sha256 清单
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          sha256sum *.exe > sha256sums.txt
          cat sha256sums.txt

      - name: 上传安装包产物（artifact 保留 90 天，正式分发用 Release）
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 创建 GitHub Release（安装包 + sha256 清单；C3 完整兑现）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/sha256sums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
