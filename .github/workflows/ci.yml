# LovelyFrida CI（docs/10 附二 C3）：
# - test：每次 push/PR 跑前端测试/类型检查 + agent 构建 + cargo check/test（windows：后端是 Win 专属路径）
# - build：打 v* tag 时跑两步构建（sidecar exe + NSIS 安装包），按 manifest 供给随包二进制并对账 sha256
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: agent 构建（先于 cargo：frida.rs include_str! 内嵌 dist/core.js）
        working-directory: agent
        run: |
          npm ci
          npm run check
          npm run build

      - name: 前端测试 + 类型检查 + 构建
        run: |
          npm ci
          npm test
          npm run build

      - name: Rust 检查 + 测试
        working-directory: src-tauri
        run: |
          cargo check
          cargo test

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 按 manifest 供给随包二进制（sha256 对账，S-01 供应链）
        run: python scripts/ci_provision_binaries.py

      - name: 安装 sidecar 构建依赖（frida 版本必须与矩阵一致，S-01）
        shell: bash
        run: |
          FRIDA_VERSION=$(python -c "import json;print(next(e['version'] for e in json.load(open('bin/binary_manifest.json'))['files'] if e.get('name')=='frida-server'))")
          echo "frida client = $FRIDA_VERSION"
          pip install "frida==$FRIDA_VERSION" pyinstaller

      - name: agent 构建
        working-directory: agent
        run: |
          npm ci
          npm run check
          npm run build

      - name: 前端构建
        run: |
          npm ci
          npm run build

      - name: ① sidecar exe（PyInstaller onefile）
        run: python scripts/build_sidecar.py

      - name: ② NSIS 安装包
        run: npx tauri build

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
